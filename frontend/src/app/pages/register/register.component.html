<div class="auth-shell">
  <h1>Create an account</h1>
  <p class="auth-intro">
    Understand what you are signing before you sign it.
  </p>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Full name
        <input type="text" formControlName="fullName" autocomplete="name" />
      </label>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
          <small class="error">At least 8 characters</small>
        }
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Sign up' }}
      </button>
    </form>
  </div>

  <p class="form-foot">Already registered? <a routerLink="/login">Log in</a></p>
</div>
