<header class="topbar">
  <a routerLink="/documents" class="brand">
    <span class="brand-mark">CG</span>
    ContractGuard
  </a>

  <nav>
    @if (auth.isLoggedIn()) {
      <span class="user">{{ auth.email() }}</span>
      <button type="button" class="btn-ghost" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register">Sign up</a>
    }
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>
